[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmind"
version = "0.1.0"
description = "Market-memory microservice for agent harnesses — S&P 500 + Eurostoxx 600"
requires-python = ">=3.11"
dependencies = [
    # Data sources
    "yfinance>=0.2",
    "requests>=2.31",
    # Data processing
    "polars>=0.20",
    "pandas>=2.0",
    "numpy>=1.26",
    # LLM / agent
    "anthropic>=0.25",
    "tenacity>=8.2",
    # Storage
    "duckdb>=0.10",
    # PostgreSQL (migration in progress; DuckDB still in use)
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    # News (RSS-first)
    "feedparser>=6.0",
    # MCP interface
    "mcp>=1.0,<2.0",
    # Trading calendars
    "exchange-calendars>=4.5",
    # Utilities
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "live: live EDGAR download smoke tests (require network; run with RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
omit = ["tests/*", "*/prompts/*"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "data", "server"]
