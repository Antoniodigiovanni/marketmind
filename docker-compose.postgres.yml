# Independent PostgreSQL stack shared by projects on one host. The Marketmind
# installer copies this file to /srv/postgres/docker-compose.yml; application
# lifecycles must not own or stop this service.
name: shared-postgres

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in /srv/postgres/.env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_admin_password
    networks:
      database:
        aliases:
          - postgres-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password

networks:
  database:
    external: true
    name: ${POSTGRES_NETWORK:-postgres-network}

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-postgres-shared-data}
