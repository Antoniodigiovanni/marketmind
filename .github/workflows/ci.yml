name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      # Offline by design: live EDGAR tests are skipped unless RUN_LIVE_TESTS=1.
      # --cov-fail-under lives here rather than in pyproject addopts so that
      # running a single test file locally does not fail on total coverage.
      - name: Tests
        run: >
          uv run --frozen pytest tests/ -q
          --cov=. --cov-report=term-missing --cov-fail-under=85
