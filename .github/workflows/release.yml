name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketmind
          POSTGRES_PASSWORD: marketmind
          POSTGRES_DB: marketmind_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketmind -d marketmind_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Test before publishing
        env:
          MARKETMIND_REQUIRE_POSTGRES: "1"
        run: uv run --frozen pytest tests/ -q --cov=. --cov-fail-under=85
      - name: Verify live external-service contracts
        env:
          RUN_LIVE_TESTS: "1"
          SEC_CONTACT_NAME: ${{ secrets.SEC_CONTACT_NAME }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: uv run --frozen pytest tests/integration -v -m live --no-cov

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create native application archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
          mkdir -p bundle/marketmind
          git archive HEAD agent data server dashboard deploy .env.example pyproject.toml uv.lock | \
            tar -xf - -C bundle/marketmind
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" > bundle/marketmind/release.env
          tar -czf "marketmind-${RELEASE_TAG}-native.tar.gz" -C bundle marketmind
          sha256sum "marketmind-${RELEASE_TAG}-native.tar.gz" > \
            "marketmind-${RELEASE_TAG}-native.tar.gz.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "marketmind-${RELEASE_TAG}-native.tar.gz" \
            "marketmind-${RELEASE_TAG}-native.tar.gz.sha256" \
            --verify-tag --notes "Native Debian/Ubuntu application archive for $RELEASE_TAG."
