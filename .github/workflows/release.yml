name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketmind
          POSTGRES_PASSWORD: marketmind
          POSTGRES_DB: marketmind_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketmind -d marketmind_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Test before publishing
        env:
          MARKETMIND_REQUIRE_POSTGRES: "1"
        run: uv run --frozen pytest tests/ -q --cov=. --cov-fail-under=85
      - name: Verify live SEC contracts
        env:
          RUN_LIVE_TESTS: "1"
          SEC_CONTACT_NAME: ${{ secrets.SEC_CONTACT_NAME }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: uv run --frozen pytest tests/integration/test_sec_live.py -q -m live --no-cov

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set registry name
        id: registry
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish application image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.registry.outputs.image }}:${{ github.ref_name }}
            ${{ steps.registry.outputs.image }}:latest
          labels: org.opencontainers.image.version=${{ github.ref_name }}
      - name: Create matching host bundle
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.registry.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker pull pgvector/pgvector:pg16
          postgres_ref="$(docker image inspect pgvector/pgvector:pg16 --format '{{index .RepoDigests 0}}')"
          test -n "$postgres_ref"
          mkdir -p bundle/deploy
          cp docker-compose.prod.yml docker-compose.postgres.yml .env.example bundle/
          cp deploy/*.sh deploy/logrotate deploy/README.md bundle/deploy/
          cp -R deploy/systemd bundle/deploy/
          printf 'MARKETMIND_IMAGE=%s@%s\nMARKETMIND_POSTGRES_IMAGE=%s\nRELEASE_TAG=%s\n' \
            "$IMAGE_NAME" "$IMAGE_DIGEST" "$postgres_ref" "$RELEASE_TAG" > bundle/release.env
          tar -czf "marketmind-${RELEASE_TAG}-deploy.tar.gz" -C bundle .
          sha256sum "marketmind-${RELEASE_TAG}-deploy.tar.gz" > "marketmind-${RELEASE_TAG}-deploy.tar.gz.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "marketmind-${RELEASE_TAG}-deploy.tar.gz" \
            "marketmind-${RELEASE_TAG}-deploy.tar.gz.sha256" \
            --verify-tag --notes "Container image and matching VPS configuration for $RELEASE_TAG."
