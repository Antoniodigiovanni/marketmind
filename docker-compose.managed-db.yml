# Optional PostgreSQL service for hosts without a shared instance. Combine
# this file with docker-compose.prod.yml; do not use it when attaching to an
# existing PostgreSQL server.
services:
  postgres:
    image: ${MARKETMIND_POSTGRES_IMAGE:?set MARKETMIND_POSTGRES_IMAGE from release.env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-marketmind-db.sh:/docker-entrypoint-initdb.d/10-marketmind.sh:ro
    secrets:
      - postgres_admin_password
      - marketmind_database_password
    networks:
      database:
        aliases:
          - postgres-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  marketmind:
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  marketmind_database_password:
    file: ./secrets/marketmind_database_password

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-postgres-shared-data}
